<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StockAlert.pro small promo</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      html, body {
        height: 280px;
        margin: 0;
        overflow: hidden;
        width: 440px;
      }
      .orb-blue { height: 220px; left: -60px; top: -80px; width: 220px; }
      .orb-purple { height: 180px; right: -40px; bottom: -40px; width: 180px; }
      .wrap {
        align-items: center;
        box-sizing: border-box;
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 196px;
        height: 100%;
        padding: 22px 20px 22px 24px;
      }
      h1 {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.06;
        margin: 10px 0 0;
        text-wrap: balance;
      }
      .logo { height: 22px; }
      .device {
        height: 100%;
        position: relative;
      }
      .device .browser {
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-dark);
        height: 100%;
      }
      .device .browser-bar { padding: 8px 10px; }
      .device .dot { height: 7px; width: 7px; }
      .device .omnibox { font-size: 9px; padding: 5px 8px; }
      .device .article { padding: 12px 12px 56px; }
      .device .article h2 { font-size: 12px; line-height: 1.25; margin-bottom: 6px; }
      .device .article p { font-size: 9px; line-height: 1.35; margin: 0; }
      .device .overlay {
        bottom: 10px;
        left: 10px;
        padding: 10px;
        position: absolute;
        right: 10px;
        width: auto;
      }
      .device .overlay .btn {
        font-size: 10px;
        min-height: 30px;
        padding: 6px 8px;
      }
      .device .mark { height: 22px; width: 22px; }
      .device .overlay strong { font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true">
      <div class="orb orb-blue"></div>
      <div class="orb orb-purple"></div>
    </div>
    <div class="canvas wrap">
      <div>
        <img class="logo" src="brand/stockalert-logo-dark.png" alt="StockAlert.pro" />
        <h1>Alerts from any page.</h1>
      </div>
      <div class="device">
        <div class="browser browser-fill">
          <div class="browser-bar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <div class="omnibox">yahoo.com/NVDA</div>
          </div>
          <div class="article">
            <h2><span class="ticker hot">NVDA</span> in focus</h2>
            <p>Click the ticker. Set the alert.</p>
          </div>
        </div>
        <div class="overlay stack">
          <div class="row">
            <img class="mark" src="brand/app-icon.png" alt="" />
            <strong>NVDA</strong>
          </div>
          <div class="btn">Create Alert</div>
        </div>
      </div>
    </div>
  </body>
</html>
